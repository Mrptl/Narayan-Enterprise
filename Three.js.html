<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_5 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_5" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_5');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
container.appendChild(renderer.domElement);

// Materials
const blueSteelMat = new THREE.MeshPhongMaterial({ color: 0x0d2e5e, shininess: 100, specular: 0x555555 });
const silverSteelMat = new THREE.MeshPhongMaterial({ color: 0xc0c0c0, shininess: 100, specular: 0xffffff });

// Create a simple "Pipe Bundle" group to represent the logo motif
const pipeGroup = new THREE.Group();
const pipeGeom = new THREE.CylinderGeometry(0.5, 0.5, 5, 32);

for(let i=0; i<3; i++) {
    const pipe = new THREE.Mesh(pipeGeom, silverSteelMat);
    pipe.position.x = i * 1.2 - 1.2;
    pipe.rotation.z = Math.PI / 2;
    pipeGroup.add(pipe);
}

// Add a large 'N' structure using boxes
const boxGeom = new THREE.BoxGeometry(0.8, 6, 0.8);
const n1 = new THREE.Mesh(boxGeom, blueSteelMat);
n1.position.set(-2, 0, 0);
const n2 = new THREE.Mesh(boxGeom, blueSteelMat);
n2.position.set(2, 0, 0);
const diagGeom = new THREE.BoxGeometry(0.8, 6.5, 0.8);
const nDiag = new THREE.Mesh(diagGeom, blueSteelMat);
nDiag.rotation.z = -0.6;
pipeGroup.add(n1, n2, nDiag);

scene.add(pipeGroup);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffffff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

camera.position.z = 10;

function animate() {
    requestAnimationFrame(animate);
    pipeGroup.rotation.y += 0.01;
    pipeGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.2;
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_5 -->


</body></html>
